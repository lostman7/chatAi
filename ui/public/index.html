<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TwinLine</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="app">
      <header>
        <h1>🌌 TwinLine</h1>
      </header>
      <section class="model-controls">
        <div class="model-card">
          <h3>Physicist Model</h3>
          <label>
            Provider
            <select id="agentAProvider">
              <option value="lmstudio">LM Studio</option>
              <option value="ollama">Ollama</option>
            </select>
          </label>
          <label>
            Model
            <input id="agentAModel" type="text" placeholder="chatgpt-oss-20b" />
          </label>
        </div>
        <div class="model-card">
          <h3>Validator Model</h3>
          <label>
            Provider
            <select id="agentBProvider">
              <option value="lmstudio">LM Studio</option>
              <option value="ollama">Ollama</option>
            </select>
          </label>
          <label>
            Model
            <input id="agentBModel" type="text" placeholder="cogito:3b" />
          </label>
        </div>
      </section>
      <main>
        <section class="chat">
          <div id="messages"></div>
          <div class="starter">
            <textarea id="starterField" placeholder="Conversation starter"></textarea>
            <div class="starter-actions">
              <button id="startLoop">Start Loop</button>
              <button id="stopLoop" class="secondary">Stop Loop</button>
            </div>
          </div>
        </section>
        <aside class="sidebar">
          <div class="panel" id="agentStatus">
            <h2>Agents</h2>
            <ul>
              <li id="agentA">
                <div class="agent-row">
                  <span class="label">🧠 Physicist</span>
                  <span class="status-light unknown" data-agent-light="AI_A"></span>
                </div>
                <div class="agent-meta">
                  <span class="state">Idle</span>
                  <button class="test-agent" data-agent="AI_A">Test Agent</button>
                </div>
              </li>
              <li id="agentB">
                <div class="agent-row">
                  <span class="label">⚙️ Validator</span>
                  <span class="status-light unknown" data-agent-light="AI_B"></span>
                </div>
                <div class="agent-meta">
                  <span class="state">Idle</span>
                  <button class="test-agent" data-agent="AI_B">Test Agent</button>
                </div>
              </li>
            </ul>
            <div class="agent-actions">
              <button id="saveAgentModels">Apply Models</button>
              <button id="reloadModels" class="secondary">Reload Models</button>
            </div>
          </div>
          <div class="panel" id="ragStatus">
            <h2>FlowChunker</h2>
            <p>📚 RAG: <span id="ragInfo">0 chunks | 0 MB used</span></p>
            <p>Last retrieval: <span id="ragRetrieval">—</span></p>
            <div class="flow-actions">
              <button id="buildArchive">Build Archive</button>
            </div>
          </div>
          <div class="panel" id="loopStatus">
            <h2>Loop</h2>
            <p>Status: <span id="loopState">Stopped</span></p>
            <p>Turn: <span id="loopTurn">0</span>/<span id="loopMax">0</span></p>
          </div>
        </aside>
      </main>
      <footer>
        <small>Reasoning Log: <span id="reasoningStatus">ON</span> • Memory Archive: <span id="memoryStatus">Inactive</span></small>
      </footer>
    </div>
    <script src="renderer.js"></script>
  </body>
</html>
